    if(!confirm('Delete this teacher?')) return;
    const id = el.getAttribute('data-id');
    DB.teachers = DB.teachers.filter(t=>t.id !== id);
    Object.keys(DB.classTeachers).forEach(c=>{ if(DB.classTeachers[c]===id) delete DB.classTeachers[c]; });
    Object.keys(DB.subjectTeachers).forEach(c=>{
      Object.keys(DB.subjectTeachers[c]).forEach(sub=>{
        if(DB.subjectTeachers[c][sub]===id) delete DB.subjectTeachers[c][sub];
      });
    });
    persist(); render(); toast('Teacher removed','ok');
    return;
  }

  /* ---- admin: timetable ---- */
  if(act === 'add-tt-day'){
    const input = $('#newTtDay');
    const day = input ? input.value.trim() : '';
    if(!day){ toast('Enter a day name','err'); return; }
    if(timetableDays().some(d=>d.toLowerCase()===day.toLowerCase())){ toast('That day already exists','err'); return; }
    DB.settings.timetableDays = timetableDays().concat(day);
    persist(); render(); toast('Day added','ok'); return;
  }
  if(act === 'add-tt-period'){
    const periods = timetablePeriods();
    const last = periods[periods.length-1];
    const next = {p: last ? Number(last.p)+1 : 1, s: last ? last.e : '08:00', e: last ? last.e : '08:45'};
    DB.settings.timetablePeriods = periods.concat(next);
    persist(); render(); toast('Period added — set its time and save','ok'); return;
  }
  if(act === 'save-timetable'){
    const cls = el.getAttribute('data-class');
    const periods = timetablePeriods().map(p=>{
      const start = $('[data-tt-start="'+p.p+'"]');
      const end = $('[data-tt-end="'+p.p+'"]');
      return Object.assign({},p,{s:start ? start.value : p.s,e:end ? end.value : p.e});
    });
    DB.settings.timetablePeriods = periods;
    const selects = $$('[data-tt-day]');
    selects.forEach(sel=>{
      const day = sel.getAttribute('data-tt-day');
      const period = Number(sel.getAttribute('data-tt-period'));
      const subject = sel.value;
      if(!DB.timetable[cls]) DB.timetable[cls] = {};
      if(!DB.timetable[cls][day]) DB.timetable[cls][day] = [];
      const arr = DB.timetable[cls][day];
      const idx = arr.findIndex(x=>x.period===period);
      if(!subject){
        if(idx>=0) arr.splice(idx,1);
        return;
      }
      const t = DB.teachers.filter(x=>x.subject===subject)[0] || DB.teachers[0];
       const tmpl = periods.filter(p=>p.p===period)[0] || {s:'',e:''};
      if(idx>=0){
        arr[idx].subject = subject;
        arr[idx].teacherId = t ? t.id : '';
      } else {
        arr.push({period:period, subject:subject, teacherId: t ? t.id : '', start:tmpl.s, end:tmpl.e});
      }
    });
    persist(); toast('Timetable saved — Smart Bags updated','ok'); render();
    return;
  }

  /* ---- admin: exams ---- */
  if(act === 'new-exam'){
    openForm({
      title:'Schedule exam',
      fields:[
        {name:'class', label:'Class', type:'select', options: DB.classes},
        {name:'subject', label:'Subject', type:'select', options: SUBJECTS},
        {name:'name', label:'Exam name', default:'Unit Test'},
        {name:'date', label:'Date', type:'date', default: offDate(7)},
        {name:'maxMarks', label:'Max marks', type:'number', default:100}
      ],
      onSave:function(d){
        DB.exams.push({
          id:uid('e'), class:d.class, subject:d.subject, name:d.name,
          date:d.date, maxMarks: Number(d.maxMarks)||100
        });
        persist(); render(); toast('Exam scheduled','ok');
      }
    });
    return;
  }
  if(act === 'del-exam'){
    if(!confirm('Delete this exam?')) return;
    const id = el.getAttribute('data-id');
    DB.exams = DB.exams.filter(e=>e.id !== id);
    DB.marks = DB.marks.filter(m=>m.examId !== id);
    persist(); render(); toast('Exam deleted','ok');
    return;
  }

  /* ---- admin: library ---- */
  if(act === 'new-book'){
    openForm({
      title:'Add book',
      fields:[
        {name:'title', label:'Title', required:true},
        {name:'author', label:'Author'},
        {name:'subject', label:'Subject', type:'select', options: SUBJECTS.concat(['General'])},
        {name:'copies', label:'Copies', type:'number', default:1}
      ],
      onSave:function(d){
        DB.library.push({id:uid('b'), title:d.title, author:d.author||'—',
          subject:d.subject, copies: Number(d.copies)||1});
        persist(); render(); toast('Book added','ok');
      }
    });
    return;
  }
  if(act === 'edit-book'){
    const b = DB.library.filter(x=>x.id===el.getAttribute('data-id'))[0];
    if(!b) return;
    openForm({
      title:'Edit book',
      values:b,
      fields:[
        {name:'title', label:'Title', required:true},
        {name:'author', label:'Author'},
        {name:'subject', label:'Subject', type:'select', options: SUBJECTS.concat(['General'])},
        {name:'copies', label:'Copies', type:'number'}
      ],
      onSave:function(d){
        b.title = d.title; b.author = d.author; b.subject = d.subject;
        b.copies = Number(d.copies)||0;
        persist(); render(); toast('Book updated','ok');
      }
    });
    return;
  }
  if(act === 'del-book'){
    if(!confirm('Delete this book?')) return;
    DB.library = DB.library.filter(b=>b.id !== el.getAttribute('data-id'));
    persist(); render(); toast('Book removed','ok');
    return;
  }

  /* ---- admin: notices & events ---- */
  if(act === 'new-notice'){
    openForm({
      title:'Publish notice',
      fields:[
        {name:'title', label:'Title', required:true},
        {name:'body', label:'Message', type:'textarea'},
        {name:'audience', label:'Audience', type:'select',
          options:[{value:'all',label:'Everyone'},{value:'student',label:'Students'},{value:'parent',label:'Parents'}]}
      ],
      onSave:function(d){
        DB.notices.unshift({
          id:uid('n'), title:d.title, body:d.body, audience:d.audience,
          date: todayISO(), author:'School Office'
        });
        DB.notifications.unshift({
          id:uid('no'), title:'New notice: '+d.title, body:d.body,
          portal:'all', date: todayISO(), read:false
        });
        persist(); render(); toast('Notice published','ok');
      }
    });
    return;
  }
  if(act === 'del-notice'){
    DB.notices = DB.notices.filter(n=>n.id !== el.getAttribute('data-id'));
    persist(); render(); return;
  }
  if(act === 'new-event'){
    openForm({
      title:'Add event',
      fields:[
        {name:'title', label:'Event name', required:true},
        {name:'date', label:'Date', type:'date', default: offDate(14)},
        {name:'venue', label:'Venue', default:'Main Campus'}
      ],
      onSave:function(d){
        DB.events.push({id:uid('ev'), title:d.title, date:d.date, venue:d.venue});
        persist(); render(); toast('Event added','ok');
      }
    });
    return;
  }
  if(act === 'del-event'){
    DB.events = DB.events.filter(e=>e.id !== el.getAttribute('data-id'));
    persist(); render(); return;
  }

  /* ---- admin: transport ---- */
  if(act === 'new-route'){
    openForm({
      title:'Add transport route',
      fields:[
        {name:'route', label:'Route name', required:true},
        {name:'bus', label:'Bus number'},
        {name:'pickup', label:'Pickup time'},
        {name:'stops', label:'Stops'},
        {name:'driver', label:'Driver'}
      ],
      onSave:function(d){
        DB.transport.push({id:uid('tr'), route:d.route, bus:d.bus,
          pickup:d.pickup, stops:d.stops, driver:d.driver});
        persist(); render(); toast('Route added','ok');
      }
    });
    return;
  }
  if(act === 'del-route'){
    DB.transport = DB.transport.filter(t=>t.id !== el.getAttribute('data-id'));
    persist(); render(); toast('Route removed','ok'); return;
  }

  /* ---- admin: resources (IndexedDB) ---- */
  if(act === 'res-download'){
    FileStore.all().then(function(files){
      const f = files.filter(x=>x.id===el.getAttribute('data-id'))[0];
      if(!f){ toast('File not found','err'); return; }
      const blob = new Blob([f.data], {type:f.type||'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }).catch(function(){ toast('File storage unavailable','err'); });
    return;
  }
  if(act === 'res-delete'){
    FileStore.del(el.getAttribute('data-id'))
      .then(()=>{ refreshResources(); toast('File deleted','ok'); })
      .catch(()=>toast('Could not delete','err'));
    return;
  }

  /* ---- admin: settings ---- */
  if(act === 'save-school'){
    const inp = $('#schoolName');
    if(inp){ DB.settings.school = inp.value.trim() || 'My School'; persist(); render(); toast('Saved','ok'); }
    return;
  }
  if(act === 'export-data'){
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bagbuddy-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Backup downloaded','ok');
    return;
  }
  if(act === 'reset-data'){
    if(!confirm('Erase ALL data on this device and start over? This cannot be undone.')) return;
    DB = emptyDB();
    saveDB();
    state.portal = 'principal';
    state.userId = null;
    state.view = 'dashboard';
    state.childId = null;
    saveSession();
    render();
    toast('All data erased','ok');
    return;
  }

  /* ---- principal: discipline ---- */
  if(act === 'principal-new-admin'){
    openForm({title:'Add School Admin',fields:[
      {name:'name',label:'Full name',required:true},
      {name:'email',label:'Email',type:'email',required:true},
      {name:'password',label:'Temporary password',type:'password',required:true}
    ],onSave:function(d){
      if(String(d.password||'').length<4){toast('Password must be at least 4 characters','err');return;}
      DB.admins.push({id:uid('a'),name:d.name,email:d.email,password:d.password,role:'Admin'});
      persist();render();toast('School Admin created','ok');
    }}); return;
  }
  if(act === 'principal-delete-admin'){
    if(!confirm('Remove this School Admin account?')) return;
    DB.admins=DB.admins.filter(a=>a.id!==el.getAttribute('data-id') || a.role==='Principal');
    persist();render();toast('School Admin removed','ok'); return;
  }
  if(act === 'principal-new-meeting'){
    openForm({title:'Schedule Staff Meeting',fields:[
      {name:'title',label:'Meeting title',required:true},
      {name:'date',label:'Date',type:'date',default:todayISO()},
      {name:'time',label:'Time',default:'10:00'},
      {name:'location',label:'Location',default:'Staff Room'},
      {name:'participants',label:'Participants',default:'All staff'},
      {name:'agenda',label:'Agenda',type:'textarea'}
    ],onSave:function(d){
      DB.meetings.push({id:uid('meeting'),title:d.title,date:d.date,time:d.time,location:d.location,participants:d.participants,agenda:d.agenda});
      persist();render();toast('Meeting scheduled','ok');
    }}); return;
  }
  if(act === 'principal-delete-meeting'){
    if(!confirm('Delete this meeting?')) return;
    DB.meetings=DB.meetings.filter(m=>m.id!==el.getAttribute('data-id'));
    persist();render();toast('Meeting deleted','ok'); return;
  }

  if(act === 'new-incident'){
    if(!DB.students.length){ toast('Add students first','err'); return; }
    openForm({
      title:'Log Discipline Incident',
      fields:[
        {name:'studentId', label:'Student', type:'select',
          options: DB.students.map(s=>({value:s.id,label:s.name+' · '+s.class}))},
        {name:'date', label:'Date', type:'date', default: todayISO()},
        {name:'type', label:'Incident Type', type:'select',
          options:['Minor','Major','Severe','Positive Note']},
        {name:'description', label:'Description', type:'textarea'},
        {name:'action', label:'Action Taken', default:''}
      ],
      onSave:function(d){
        DB.discipline.push({
          id:uid('d'), studentId:d.studentId, date:d.date, type:d.type,
          description:d.description, action:d.action, reportedBy:currentUser().name
        });
        persist(); render(); toast('Incident logged','ok');
      }
    });
    return;
  }
  if(act === 'del-incident'){
    if(!confirm('Delete this incident record?')) return;
    DB.discipline = DB.discipline.filter(d=>d.id !== el.getAttribute('data-id'));
    persist(); render(); toast('Record deleted','ok');
    return;
  }

  /* ---- searches ---- */
  if(act === 'admin-search'){
    const inp = $('#adminSearch');
    state.query = inp ? inp.value : '';
    render();
    return;
  }
  if(act === 'principal-search'){
    const inp = $('#principalSearch');
    state.query = inp ? inp.value : '';
    render();
    return;
  }
});

/* ---- change events ---- */
document.addEventListener('change', function(e){
  const t = e.target;

  if(t.id === 'roleSelect'){
    return;
  }

  if(t.id === 'bagDate'){
    state.bagDate = t.value;
    render();
    return;
  }

  if(t.id === 'attDate'){
    state.attDate = t.value;
    render();
    return;
  }

  if(t.id === 'importFile'){
    const file = t.files && t.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const data = JSON.parse(reader.result);
        validateBackup(data);
        const importedDB = normalizeDB(data);
        DB = importedDB;
        saveDB();
        state.userId = firstUserId(state.portal);
        if(!state.userId){
          if(DB.admins.length){
            const p = DB.admins.find(a=>a.role === 'Principal');
            if(p){ state.portal='principal'; state.userId=p.id; }
            else { state.portal='admin'; state.userId=DB.admins[0].id; }
          }
          else if(DB.teachers.length){ state.portal='teacher'; state.userId=DB.teachers[0].id; }
          else if(DB.students.length){ state.portal='student'; state.userId=DB.students[0].id; }
          else if(DB.parents.length){ state.portal='parent'; state.userId=DB.parents[0].id; }
        }
        state.childId = null;
        state.view = 'dashboard';
        state.query = '';
        saveSession();
        render();
        toast('Backup imported successfully','ok');
      }catch(err){
        toast('Import failed: '+err.message,'err');
      }
    };
    reader.readAsText(file);
    return;
  }

  if(t.id === 'resUpload'){
    const file = t.files && t.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      FileStore.put({
        id: uid('file'),
        name: file.name,
        type: file.type,
        size: file.size,
        added: new Date().toISOString(),
        data: reader.result
      }).then(function(){
        refreshResources();
        toast('File stored in IndexedDB','ok');
      }).catch(function(){
        toast('IndexedDB unavailable in this browser context','err');
      });
    };
    reader.readAsArrayBuffer(file);
    return;
  }
});

/* ---- search form ---- */
$('#searchForm').addEventListener('submit', function(e){
  e.preventDefault();
  const q = $('#searchInput').value.trim();
  state.query = q;
  state.view = 'search';
  saveSession();
  render();
  $('#main').scrollTop = 0;
});
$('#searchInput').addEventListener('input', function(){
  if(this.value === '' && state.view === 'search'){
    state.query = '';
    render();
  }
});

/* ---- close notification panel when clicking elsewhere ---- */
document.addEventListener('click', function(e){
  const panel = $('#notifPanel');
  if(!panel || !panel.classList.contains('show')) return;
  if(e.target.closest('.notif-wrap')) return;
  panel.classList.remove('show');
});

/* ---- keyboard shortcuts ---- */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(state.tvMode) { stopTVMode(); return; }
    closeModal();
    const p = $('#notifPanel');
    if(p) p.classList.remove('show');
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    const si = $('#searchInput');
    if(si) si.focus();
  }
  /* Enter (without Shift) sends AI message */
  if(e.key === 'Enter' && !e.shiftKey && e.target.id === 'aiUserMsg'){
    e.preventDefault();
    const btn = $('#aiSendBtn');
    if(btn && !btn.disabled){
      const mode = btn.getAttribute('data-mode') || 'tutor';
      handleAiSend(mode);
    }
  }
});

/* ============================================================
   INITIALIZATION
   ============================================================ */
function initLegacy(){
  /* ── Legacy localStorage path ── */
  const sess = loadSession();
  state.portal = sess.portal || 'principal';
  state.childId = sess.childId || null;

  let portalList = [];
  if(state.portal === 'principal') portalList = DB.admins.filter(a=>a.role === 'Principal');
  else if(state.portal === 'admin') portalList = DB.admins.filter(a=>a.role !== 'Principal');
  else if(state.portal === 'workspace') portalList = DB.workspaceAdmins;
  else if(state.portal === 'student') portalList = DB.students;
  else if(state.portal === 'teacher') portalList = DB.teachers;
  else if(state.portal === 'parent') portalList = DB.parents;

  const exists = portalList.some(u=>u.id === sess.userId);
  state.userId = exists ? sess.userId : (portalList[0] ? portalList[0].id : null);

  if(!state.userId){
    if(DB.admins.length){
      const p = DB.admins.find(a=>a.role === 'Principal');
      if(p){ state.portal = 'principal'; state.userId = p.id; }
      else { state.portal = 'admin'; state.userId = DB.admins[0].id; }
    }
    else if(DB.workspaceAdmins.length){ state.portal='workspace'; state.userId=DB.workspaceAdmins[0].id; }
    else if(DB.teachers.length){ state.portal = 'teacher'; state.userId = DB.teachers[0].id; }
    else if(DB.students.length){ state.portal = 'student'; state.userId = DB.students[0].id; }
    else if(DB.parents.length){ state.portal = 'parent'; state.userId = DB.parents[0].id; }
  }
  state.view = 'dashboard';
}

async function init(){
  try{
    DB = loadDB();
    state.theme = (DB.settings && DB.settings.theme) || 'light';
    updateOnlineStatus();

    /* No spinner — render() will show signin or dashboard immediately */

    if(_sbConfigured && SB){
      /* ── Read session directly from localStorage (no async Supabase call) ── */
      var sbSession = null;
      try {
        /* Supabase v2 stores session under 'sb-<project>-auth-token' */
        var lsKeys = Object.keys(localStorage);
        for(var i = 0; i < lsKeys.length; i++){
          var k = lsKeys[i];
          try {
            var v = JSON.parse(localStorage.getItem(k) || 'null');
            if(!v) continue;
            /* Format 1: {access_token, user} */
            if(v.access_token && v.user){ sbSession = v; break; }
            /* Format 2: {session: {access_token, user}} */
            if(v.session && v.session.access_token){ sbSession = v.session; break; }
            /* Format 3: nested currentSession */
            if(v.currentSession && v.currentSession.access_token){ sbSession = v.currentSession; break; }
          } catch(e){}
        }
      } catch(e){}

      /* Debug: log what we found */
      console.log('BagBuddy session found:', sbSession ? 'YES user='+(sbSession.user && sbSession.user.id) : 'NO');

      /* Clear any loading state */
      var spinEl = document.getElementById('appShell');
      if(spinEl) spinEl.innerHTML = '';

      if(sbSession && sbSession.user){
        _sbUser = sbSession.user;
        state.signedOut = false;
        state.view = 'dashboard';
        state.userId = sbSession.user.id;

        /* Get role from JWT app_metadata */
        var meta = sbSession.user.app_metadata || {};
        if(meta.role){
          state.portal = roleToPortal(meta.role);
          render();
          /* Load profile in background */
          fetch(_cfg.supabaseUrl+'/rest/v1/profiles?id=eq.'+sbSession.user.id+'&select=*', {
            headers: {
              'apikey': _cfg.supabaseAnonKey,
              'Authorization': 'Bearer '+sbSession.access_token
            }
          }).then(function(r){ return r.json(); }).then(function(rows){
            if(rows && rows[0]){ _sbProfile = rows[0]; render(); }
          }).catch(function(){});
          /* Listen for auth changes */
          SB.auth.onAuthStateChange(function(event, session){
            if(event === 'SIGNED_OUT'){
              _sbUser = null; _sbProfile = null;
              state.signedOut = true; state.authMode = 'signin';
              render();
            }
          });
          return;
        }
      }

      /* No session found — show sign in */
      state.signedOut = true;
      state.authMode = 'signin';
    } else {
      /* ── Legacy localStorage mode ── */
      initLegacy();
    }

    render();
    console.log('%cBagBuddy ready'+(SB?' [Supabase]':' [local]'),'background:#4f46e5;color:#fff;padding:3px 8px;border-radius:6px');
  } catch(err){
    console.error('Initialization Error:', err);
    const main = $('#main');
    if(main) main.innerHTML = '<div class="empty" style="color:var(--danger)"><p><b>Could not start BagBuddy</b></p><p>'+esc(err.message)+'</p><p>Please reload the page.</p></div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
