<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f9; --surface-3:#e4eaf4;
  --border:#e1e8f2; --text:#0f172a; --muted:#64748b;
  --primary:#4f46e5; --primary-2:#6366f1; --primary-soft:#eef0ff;
  --accent:#0ea5e9; --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px -18px rgba(15,23,42,.35);
  --shadow-lg:0 20px 60px -20px rgba(15,23,42,.45);
}
[data-theme="dark"]{
  --bg:#080d19; --surface:#111827; --surface-2:#1a2337; --surface-3:#243049;
  --border:#26314a; --text:#e8eefb; --muted:#94a3b8;
  --primary:#7c83ff; --primary-2:#8f95ff; --primary-soft:#1e2544;
  --accent:#38bdf8; --success:#34d399; --warn:#fbbf24; --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  --shadow-lg:0 20px 60px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Inter',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{
  height:64px; flex:0 0 64px; display:flex; align-items:center; gap:12px;
  padding:0 14px; background:var(--surface); border-bottom:1px solid var(--border);
  position:relative; z-index:60;
}
.body{display:flex;flex:1;min-height:0;position:relative}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--border);
  overflow-y:auto; padding:12px 10px 30px;
}
.main{flex:1;min-width:0;overflow-y:auto;padding:22px 24px 60px}
.backdrop{display:none}

@media (max-width:900px){
  .sidebar{
    position:fixed; top:64px; bottom:0; left:0; z-index:50;
    transform:translateX(-105%); transition:transform .25s ease; box-shadow:var(--shadow-lg);
    width:270px; flex-basis:270px;
  }
  .sidebar.open{transform:none}
  .backdrop{display:none;position:fixed;inset:64px 0 0 0;background:rgba(8,13,25,.5);z-index:45}
  .backdrop.show{display:block}
  .main{padding:16px 14px 70px}
}
@media (max-width:600px){
  .search{display:none}
  .brand-text{display:none}
}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
.brand-logo{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.brand-text{font-size:22px;letter-spacing:-.5px}
.brand-text .bag{color:#007A8C}
.brand-text .buddy{color:#F27E46}

/* ---------- search ---------- */
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--border);border-radius:11px;padding:0 10px;height:38px}
.search input{border:0;background:transparent;color:var(--text);outline:none;flex:1;font-size:13px;height:100%}
.search .ic{color:var(--muted);width:16px;height:16px}

/* ---------- top actions ---------- */
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.role-select{height:38px;padding:0 10px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:12.5px;font-weight:600;max-width:190px;cursor:pointer}
.role-select:disabled{opacity:.6;cursor:not-allowed}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:8px 13px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
  cursor:pointer; transition:background .15s,border-color .15s,transform .08s; white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-icon{padding:0;width:38px;height:38px;border-radius:11px;position:relative}
.ic{width:18px;height:18px;flex:0 0 auto}
.only-mobile{display:none}
@media (max-width:900px){ .only-mobile{display:inline-flex} }

/* ---------- nav ---------- */
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border:0;border-radius:10px;background:none;cursor:pointer;
  color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:2px;transition:.15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 8px 18px -10px var(--primary)}
.nav-item.active .ic{color:#fff}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28)}

/* ---------- page head ---------- */
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-hd h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.page-hd p{color:var(--muted);font-size:13px;margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-hd h3{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card-bd{padding:16px}
.card-bd.tight{padding:10px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1150px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:720px){ .g2,.g3,.g4{grid-template-columns:1fr} }

/* ---------- hero ---------- */
.hero{
  border-radius:var(--radius); padding:22px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(120deg,var(--primary) 0%, #7c3aed 55%, var(--accent) 100%);
  box-shadow:0 20px 45px -25px var(--primary);
}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero p{opacity:.9;font-size:13px;margin-top:4px}
.hero-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
.hero-stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:10px 16px;backdrop-filter:blur(6px)}
.hero-stat b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.hero-stat span{font-size:11.5px;opacity:.88;letter-spacing:.03em;text-transform:uppercase;font-weight:600}

/* ---------- stat card ---------- */
.stat{display:flex;align-items:center;gap:14px;padding:16px}
.stat-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 44px}
.stat-ic .ic{width:21px;height:21px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.tint-primary{background:var(--primary-soft);color:var(--primary)}
.tint-success{background:rgba(16,185,129,.13);color:var(--success)}
.tint-warn{background:rgba(245,158,11,.15);color:var(--warn)}
.tint-danger{background:rgba(239,68,68,.13);color:var(--danger)}
.tint-accent{background:rgba(14,165,233,.14);color:var(--accent)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--surface-2)}

/* ---------- timetable ---------- */
.tt td{font-size:12.5px;min-width:110px}
.tt-period{white-space:nowrap}
.tt-period b{display:block;font-size:12.5px}
.tt-period span{font-size:11px;color:var(--muted)}
.tt-subj{display:block;font-weight:700;font-size:12.5px}
.tt-teacher{display:block;font-size:11px;color:var(--muted)}
.tt-time{width:72px;padding:4px 5px;font-size:11px;margin:2px 0}
.tt-today{background:var(--primary-soft)!important}
[data-theme="dark"] .tt-today{background:#1c2340!important}

/* ---------- badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:rgba(16,185,129,.14);color:var(--success)}
.badge.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.badge.bad{background:rgba(239,68,68,.14);color:var(--danger)}
.badge.info{background:rgba(14,165,233,.14);color:var(--accent)}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid transparent;cursor:pointer}
.chip.active{background:var(--primary);color:#fff}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase}
.input,.select{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.input:focus,.select:focus{border-color:var(--primary)}
textarea.input{resize:vertical;min-height:70px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .field{margin-bottom:0;flex:1;min-width:140px}

/* ---------- progress / rings ---------- */
.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}
.ring{
  --p:0; width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--primary) calc(var(--p)*1%), var(--surface-3) 0);
  position:relative;flex:0 0 auto;
}
.ring::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1;font-weight:800;font-size:19px}

/* ---------- charts ---------- */
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:14px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart-bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--primary),var(--accent));position:relative;min-height:4px;
  display:flex;align-items:flex-start;justify-content:center}
.chart-bar span{position:absolute;top:-17px;font-size:10.5px;font-weight:800;color:var(--muted)}
.chart-lbl{font-size:10.5px;color:var(--muted);font-weight:700}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;
  font-size:13px;color:#fff;flex:0 0 36px;background:linear-gradient(135deg,var(--primary),var(--accent))}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .grow span{font-size:12px;color:var(--muted)}

/* ---------- bag / locker ---------- */
.bag-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.15s}
.bag-item:hover{border-color:var(--primary)}
.bag-item.done{background:var(--primary-soft);border-color:transparent}
.bag-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;flex:0 0 22px;color:#fff}
.bag-item.done .bag-check{background:var(--success);border-color:var(--success)}
.bag-check .ic{width:14px;height:14px}
.bag-label{flex:1;font-size:13px;font-weight:600}
.bag-item.done .bag-label{text-decoration:line-through;opacity:.65}
.locker-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:12px}
.locker-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;display:flex;flex-direction:column}
.locker-card .title{font-weight:700;font-size:14px;margin-bottom:4px}
.locker-card .subject{font-size:12px;color:var(--muted);margin-bottom:10px}
.locker-card .weight{font-size:11px;color:var(--muted);margin-top:auto;margin-bottom:8px}
.locker-card .actions{display:flex;gap:6px;justify-content:flex-end}
.locker-status{position:absolute;top:12px;right:12px;font-size:10px;padding:3px 8px;border-radius:99px;font-weight:800}
.status-stored{background:rgba(14,165,233,.15);color:var(--accent)}
.status-taken{background:rgba(245,158,11,.15);color:var(--warn)}
.status-returned{background:rgba(16,185,129,.15);color:var(--success)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{width:38px;height:38px;opacity:.35;margin-bottom:10px}
.empty p{font-size:13px}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(8,13,25,.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;
  max-width:480px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .16s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-hd h3{font-size:15px;font-weight:800}
.modal-bd{padding:16px;overflow-y:auto}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ---------- notifications ---------- */
.notif-wrap{position:relative}
.notif-panel{display:none;position:absolute;right:0;top:46px;width:340px;max-width:88vw;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);
  z-index:80;overflow:hidden}
.notif-panel.show{display:block}
.notif-panel .np-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border)}
.notif-panel .np-hd b{font-size:13px}
.np-list{max-height:330px;overflow-y:auto}
.np-item{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px}
.np-item:last-child{border-bottom:0}
.np-item.unread{background:var(--primary-soft)}
.np-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:0 0 8px}
.np-item b{font-size:12.5px;display:block}
.np-item span{font-size:11.5px;color:var(--muted)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);display:none}
.dot.show{display:block}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:13px;
  font-weight:600;box-shadow:var(--shadow-lg);animation:up .22s ease;max-width:90vw}
.toast.ok{background:var(--success);color:#fff}
.toast.err{background:var(--danger);color:#fff}
.toast.out{opacity:0;transform:translateY(8px);transition:.28s}
.signin-page{min-height:calc(100vh - 64px);display:grid;grid-template-columns:1.05fr .95fr;background:var(--surface)}
.signin-art{position:relative;overflow:hidden;padding:54px 48px;color:#fff;background:linear-gradient(145deg,#007a8c 0%,#075985 48%,#172554 100%);display:flex;flex-direction:column;justify-content:space-between}
.signin-art:before,.signin-art:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px)}
.signin-art:before{width:360px;height:360px;right:-120px;top:90px}.signin-art:after{width:260px;height:260px;left:-120px;bottom:80px}
.signin-art-content{position:relative;z-index:1}.signin-art h1{font-size:42px;letter-spacing:-.04em;margin:22px 0 10px}.signin-art p{max-width:420px;font-size:16px;opacity:.9}.signin-art-quote{position:relative;z-index:1;font-size:20px;font-weight:700;letter-spacing:.02em}
.signin-mark{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:800}.signin-mark b:first-child{color:#b9f6ff}.signin-mark b:last-child{color:#ffd1bd}
.signin-panel{display:flex;align-items:center;justify-content:center;padding:40px 8%;background:var(--surface)}
.signin-box{width:100%;max-width:480px}.signin-box h2{font-size:32px;margin-bottom:8px}.signin-box>p{color:var(--muted);margin-bottom:28px}.signin-box .select,.signin-box .input{background:var(--surface-2);min-height:52px;font-size:15px}.signin-submit{width:100%;min-height:52px;background:#126b3a;border-color:#126b3a;color:#fff;font-size:16px}.signin-submit:hover{background:#0d542d;border-color:#0d542d}.signin-forgot{display:block;text-align:right;margin-top:-4px;margin-bottom:22px;font-size:13px}.signin-note{font-size:12px;color:var(--muted);margin-top:16px}.signin-help{margin-top:42px;text-align:center;color:var(--muted);font-size:13px}
.signed-out-mode .topbar{display:none}.signed-out-mode .sidebar{display:none}.signed-out-mode .body{display:block}.signed-out-mode .main{padding:0;overflow:auto}.signed-out-mode .backdrop{display:none}
@media(max-width:800px){.signin-page{grid-template-columns:1fr}.signin-art{min-height:260px;padding:30px}.signin-art h1{font-size:30px}.signin-art-quote{display:none}.signin-panel{padding:34px 20px}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Supabase Auth overlay ---------- */
.sb-loading{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.sb-loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

<script>
"use strict";

/* ============================================================
   SUPABASE CLIENT — initialised from window.BAGBUDDY_CONFIG
   The anon key is safe to expose in the browser.
   All privileged operations go through RLS or Edge Functions.
   ============================================================ */
const _cfg = window.BAGBUDDY_CONFIG || {};
const _sbConfigured = _cfg.supabaseUrl && _cfg.supabaseUrl.indexOf('YOUR_PROJECT') < 0;
const SB = _sbConfigured
  ? window.supabase.createClient(_cfg.supabaseUrl, _cfg.supabaseAnonKey)
  : null;

/* ---- Supabase Auth helpers ---- */
let _sbUser = null;   // current auth.User
let _sbProfile = null; // current profiles row

async function sbGetSession(){
  if(!SB) return null;
  const { data } = await SB.auth.getSession();
  return data.session;
}
async function sbRefreshUser(){
  if(!SB){ _sbUser = null; _sbProfile = null; return; }
  try {
    /* getSession is fast (local) — getUser does a network round-trip */
    const { data:{ session } } = await SB.auth.getSession();
    if(!session){ _sbUser = null; _sbProfile = null; return; }
    _sbUser = session.user;
    /* Load profile row */
    const { data } = await SB.from('profiles').select('*').eq('id', session.user.id).single();
    _sbProfile = data;
  } catch(e){
    console.warn('sbRefreshUser error:', e);
    _sbUser = null; _sbProfile = null;
  }
}

/* Map Supabase role → legacy portal string */
function roleToPortal(role){
  const map = {
    workspace_admin: 'workspace', principal: 'principal',
    school_admin: 'admin', teacher: 'teacher', parent: 'parent',
    student: 'student', support_staff: 'admin'
  };
  return map[role] || 'admin';
}

async function sbSignIn(email, password){
  if(!SB) throw new Error('Supabase not configured');
  const { data, error } = await SB.auth.signInWithPassword({ email, password });
  if(error) throw error;
  await sbRefreshUser();
  return data;
}
async function sbSignUp(email, password, meta){
  if(!SB) throw new Error('Supabase not configured');
  const { data, error } = await SB.auth.signUp({ email, password, options:{ data: meta } });
  if(error) throw error;
  return data;
}
async function sbSignOut(){
  if(!SB) return;
  await SB.auth.signOut();
  _sbUser = null; _sbProfile = null;
}
async function sbRegisterSchool(fullName, schoolName, phone){
  if(!_cfg.supabaseUrl) throw new Error('Supabase not configured');
  /* Get token from localStorage directly */
  let accessToken = '';
  try {
    const keys = Object.keys(localStorage).filter(k => k.includes('auth-token') || k.includes('supabase'));
    for(const k of keys){
      try {
        const val = JSON.parse(localStorage.getItem(k) || '{}');
        if(val.access_token){ accessToken = val.access_token; break; }
        if(val.session && val.session.access_token){ accessToken = val.session.access_token; break; }
        if(val.currentSession && val.currentSession.access_token){ accessToken = val.currentSession.access_token; break; }
      } catch(e){}
    }
  } catch(e){}
  if(!accessToken) throw new Error('Not signed in');
  const response = await fetch(
    _cfg.supabaseUrl + '/functions/v1/register-school',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken,
        'apikey': _cfg.supabaseAnonKey
      },
      body: JSON.stringify({ fullName, schoolName, phone })
    }
  );
  if(!response.ok){
    const err = await response.text().catch(function(){ return response.status; });
    throw new Error('Registration error: ' + err);
  }
  const data = await response.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function sbResetPassword(email){
  if(!SB) throw new Error('Supabase not configured');
  const { error } = await SB.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error) throw error;
}
async function sbUpdatePassword(newPassword){
  if(!SB) throw new Error('Supabase not configured');
  const { error } = await SB.auth.updateUser({ password: newPassword });
  if(error) throw error;
}

/* ---- AI Edge Function caller ---- */
let _aiHistory = { tutor: [], helpdesk: [] };

async function callAiEdgeFunction(mode, message, extraCtx){
  if(!_cfg.supabaseUrl) throw new Error('Supabase not configured');

  /* Get token directly from localStorage — avoids hanging SB.auth calls */
  let accessToken = '';
  try {
    const keys = Object.keys(localStorage).filter(k => k.includes('auth-token') || k.includes('supabase'));
    for(const k of keys){
      try {
        const val = JSON.parse(localStorage.getItem(k) || '{}');
        if(val.access_token){ accessToken = val.access_token; break; }
        if(val.session && val.session.access_token){ accessToken = val.session.access_token; break; }
        if(val.currentSession && val.currentSession.access_token){ accessToken = val.currentSession.access_token; break; }
      } catch(e){}
    }
  } catch(e){}

  if(!accessToken) throw new Error('Not signed in — please refresh and sign in again');

  const profile = _sbProfile || {};
  const body = {
    message,
    mode,
    userRole:     profile.role || 'unknown',
    schoolId:     profile.school_id || '',
    classContext: profile.class_name || '',
    subject:      (extraCtx && extraCtx.subject) || '',
    history:      _aiHistory[mode] || []
  };

  const response = await fetch(
    _cfg.supabaseUrl + '/functions/v1/ai-chat',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken,
        'apikey': _cfg.supabaseAnonKey
      },
      body: JSON.stringify(body)
    }
  );

  if(!response.ok){
    const err = await response.text().catch(function(){ return response.status; });
    throw new Error('Edge Function error: ' + err);
  }

  const data = await response.json();
  if(data.error) throw new Error(data.error);

  /* Append to rolling history */
  _aiHistory[mode] = (_aiHistory[mode] || []).concat(
    { role: 'user', content: message },
    { role: 'assistant', content: data.reply }
  ).slice(-20);

  return data.reply;
}

/* ---- Supabase data helpers (replace localStorage reads) ---- */
/* These are async wrappers that fallback to DB (localStorage) when offline */
async function sbFetch(table, query, fallback){
  if(!SB || !_sbUser) return fallback();
  try {
    const { data, error } = await query(SB.from(table));
    if(error){ console.warn('SB fetch error', table, error.message); return fallback(); }
    return data;
  } catch(e){ return fallback(); }
}

/* ============================================================
   4. DATA MODEL AND STORAGE SERVICES
   ============================================================ */
const SUBJECTS = ['Mathematics','English','Science','Social Studies','Computer Science','Hindi','Art','Physical Education'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const DAYMAP = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PERIODS = [
  {p:1,s:'08:00',e:'08:45'},{p:2,s:'08:50',e:'09:35'},{p:3,s:'09:40',e:'10:25'},
  {p:4,s:'10:45',e:'11:30'},{p:5,s:'11:35',e:'12:20'},{p:6,s:'13:00',e:'13:45'},
  {p:7,s:'13:50',e:'14:35'}
];
function timetableDays(){ return (DB && DB.settings && Array.isArray(DB.settings.timetableDays) && DB.settings.timetableDays.length) ? DB.settings.timetableDays : DAYS; }
function timetablePeriods(){ return (DB && DB.settings && Array.isArray(DB.settings.timetablePeriods) && DB.settings.timetablePeriods.length) ? DB.settings.timetablePeriods : PERIODS; }

function offDate(n){
  const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
const todayISO = () => offDate(0);
const tomorrowISO = () => offDate(1);

function emptyDB(){
  return {
    meta:{version:5, createdAt:Date.now()},
    settings:{school:'My School', theme:'light'},
    classes: ['6A','6B','7A','8A','9A','10A'],
    classTeachers: {},
    subjectTeachers: {},
    students:[], teachers:[], parents:[], admins:[], workspaceAdmins:[{id:'workspace_owner',name:'Dandamudi Venkata Rohan Sai',email:'sigmaohioabc7@gmail.com',password:'RohanSai',role:'Workspace Admin'}], staff:[],
    timetable:{}, homework:[], attendance:[], exams:[], marks:[], fees:[], classFees:{}, medical:[],
    notices:[], events:[], library:[], posts:[], transport:[], notifications:[], schools:[], meetings:[],
    bagChecks:{}, bagCustom:[], hwDone:{}, borrowed:[], resources:[],
    discipline: [], notes: [],
    locker: [], projects: [], departureSettings: {rotationInterval: 15, selectedClasses: [], tvMode: false}
  };
}

function normalizeDB(d){
  const base = emptyDB();
  if(!d || typeof d !== 'object' || Array.isArray(d)) return base;
  Object.keys(base).forEach(k=>{
    if(d[k] === undefined || d[k] === null){
      d[k] = base[k];
    } else if(Array.isArray(base[k])){
      if(!Array.isArray(d[k])){
        d[k] = base[k];
      } else if(k === 'classes'){
        d[k] = d[k].filter(item=>typeof item === 'string');
      } else {
        d[k] = d[k].filter(item=>item && typeof item === 'object' && !Array.isArray(item));
      }
    } else if(typeof base[k] === 'object' &&
              (typeof d[k] !== 'object' || Array.isArray(d[k]))){
      d[k] = base[k];
    }
  });
  if(!d.settings.school) d.settings.school = base.settings.school;
  if(!Array.isArray(d.classes) || !d.classes.length) d.classes = base.classes;
  if(!['light','dark'].includes(d.settings.theme)) d.settings.theme = base.settings.theme;
  if(!Array.isArray(d.departureSettings.selectedClasses)) d.departureSettings.selectedClasses = [];
  if(!d.departureSettings.overrides || typeof d.departureSettings.overrides !== 'object' ||
     Array.isArray(d.departureSettings.overrides)) d.departureSettings.overrides = {};
  if(!Array.isArray(d.settings.timetableDays) || !d.settings.timetableDays.length) d.settings.timetableDays = DAYS.slice();
  if(!Array.isArray(d.settings.timetablePeriods) || !d.settings.timetablePeriods.length) d.settings.timetablePeriods = PERIODS.map(p=>({...p}));
  if(!d.classFees || typeof d.classFees !== 'object' || Array.isArray(d.classFees)) d.classFees = {};
  ['students','teachers','parents','admins','workspaceAdmins'].forEach(k=>d[k].forEach(u=>{ if(!u.password) u.password = 'bagbuddy'; }));
  if(!d.workspaceAdmins.some(u=>u.email==='sigmaohioabc7@gmail.com')) d.workspaceAdmins.push({id:'workspace_owner',name:'Dandamudi Venkata Rohan Sai',email:'sigmaohioabc7@gmail.com',password:'RohanSai',role:'Workspace Admin'});
  if(!Array.isArray(d.staff)) d.staff = [];
  if(!Array.isArray(d.medical)) d.medical = [];
  return d;
}

function validateBackup(data){
  if(!data || typeof data !== 'object' || Array.isArray(data) ||
     !data.meta || typeof data.meta !== 'object' || Array.isArray(data.meta) ||
     !Array.isArray(data.students)){
    throw new Error('Invalid backup file');
  }
  const base = emptyDB();
  Object.keys(base).forEach(k=>{
    if(data[k] === undefined || data[k] === null) return;
    if(Array.isArray(base[k])){
      if(!Array.isArray(data[k])) throw new Error('Invalid backup field: '+k);
      const invalidItem = k === 'classes'
        ? data[k].some(item=>typeof item !== 'string')
        : data[k].some(item=>!item || typeof item !== 'object' || Array.isArray(item));
      if(invalidItem)
        throw new Error('Invalid items in backup field: '+k);
    } else if(typeof base[k] === 'object'){
      if(typeof data[k] !== 'object' || Array.isArray(data[k]))
        throw new Error('Invalid backup field: '+k);
    }
  });
  return data;
}

// v5 storage key; loadDB migrates saved v4 data before retiring the legacy key.
const STORE_KEY = 'bagbuddy.db.v5';
const LEGACY_KEY = 'bagbuddy.db.v4';
const SESSION_KEY = 'bagbuddy.session.v1';

let DB = null;

function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('Could not save — storage may be full','err'); }
}
let saveTimer = null;
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDB, 120); }

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.meta) return normalizeDB(d);
    }
  }catch(e){ /* corrupt or unavailable current storage; try migration below */ }

  // Preserve v4 data by migrating it before removing the legacy key.
  try{
    const legacyRaw = localStorage.getItem(LEGACY_KEY);
    if(legacyRaw){
      const legacy = JSON.parse(legacyRaw);
      if(legacy && legacy.meta){
        const migrated = normalizeDB(legacy);
        localStorage.setItem(STORE_KEY, JSON.stringify(migrated));
        localStorage.removeItem(LEGACY_KEY);
        return migrated;
      }
    }
  }catch(e){ /* keep legacy data if migration or storage write fails */ }
  return emptyDB();
}

function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      portal: state.portal, userId: state.userId, childId: state.childId
    }));
  }catch(e){}
}
function loadSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'{}'); }catch(e){ return {}; }
}

/* ---- IndexedDB for larger local files (resource uploads) ---- */
const FileStore = (function(){
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      if(!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
      let req;
      try{ req = indexedDB.open('bagbuddy-files', 1); }
      catch(e){ return rej(e); }
      req.onupgradeneeded = ()=>{
        const d = req.result;
        if(!d.objectStoreNames.contains('files')) d.createObjectStore('files', {keyPath:'id'});
      };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error || new Error('IndexedDB error'));
    });
    return dbp;
  }
  async function put(rec){
    const d = await open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('files','readwrite');
      tx.objectStore('files').put(rec);
      tx.oncomplete = ()=>res(true);
      tx.onerror = ()=>rej(tx.error);
    });
  }
  async function all(){
    const d = await open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('files','readonly');
      const rq = tx.objectStore('files').getAll();
      rq.onsuccess = ()=>res(rq.result || []);
      rq.onerror = ()=>rej(rq.error);
    });
  }
  async function del(id){
    const d = await open();
    return new Promise((res,rej)=>{
      const tx = d.transaction('files','readwrite');
      tx.objectStore('files').delete(id);
      tx.oncomplete = ()=>res(true);
      tx.onerror = ()=>rej(tx.error);
    });
  }
  return {put, all, del};
})();

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
}
function fmtShort(d){
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
}
function daysUntil(d){
  const a = new Date(todayISO()+'T00:00:00');
  const b = new Date(d+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function initials(name){
  return String(name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  $('#toasts').appendChild(el);

}

function attStats(studentId){

  return {present, late, absent, total: recs.length, pct: Math.round(((present+late)/total)*100)};

/* ---------- guardian linking (one guardian per child) ---------- */
function linkGuardian(studentId, parentId){
  const s = studentById(studentId);
  if(!s) return;
  DB.parents.forEach(p=>{ p.childIds = p.childIds.filter(id=>id!==studentId); });
  s.guardianId = parentId || null;
  if(parentId){
    const p = DB.parents.filter(x=>x.id===parentId)[0];
    if(p) p.childIds.push(studentId);
  }
}
function setParentChildren(parentId, childIds){
  childIds = childIds || [];
  const p = DB.parents.filter(x=>x.id===parentId)[0];
  if(!p) return;
  DB.parents.forEach(other=>{
    if(other.id===parentId) return;
    other.childIds = other.childIds.filter(id=>childIds.indexOf(id)<0);
  });
  p.childIds = childIds.slice();
  DB.students.forEach(s=>{
    if(childIds.indexOf(s.id)>=0) s.guardianId = parentId;
    else if(s.guardianId===parentId) s.guardianId = null;
  });
}

/* ---------- SMART BAG ENGINE ---------- */
function bagFor(studentId, dateISO){
  const s = studentById(studentId);
  const out = {items:[], checked:[], student:s};
  if(!s) return out;
  const dow = new Date(dateISO+'T00:00:00').getDay();
  const day = DAYMAP[dow];
  const periods = (DB.timetable[s.class] && DB.timetable[s.class][day]) || [];

  periods.forEach(p=>{
    if(!p.subject) return;
    out.items.push({
      key:'tt|'+p.period+'|'+p.subject,
      label:p.subject+' — textbook & notebook',
      subject:p.subject, type:'Class', period:p.period
    });
  });

  DB.homework.filter(h=>h.class===s.class && h.due===dateISO).forEach(h=>{
    out.items.push({
      key:'hw|'+h.id,
      label:h.subject+': '+h.title,
      subject:h.subject, type:'Homework'
    });
  });

  (DB.bagCustom||[]).filter(b=>b.studentId===studentId && b.date===dateISO).forEach(b=>{
    out.items.push({key:'cu|'+b.id, label:b.label, subject:'Custom', type:'Custom'});
  });

  out.checked = DB.bagChecks[studentId+'|'+dateISO] || [];
  return out;
}
function toggleBagItem(studentId, dateISO, key){
  const k = studentId+'|'+dateISO;
  const list = DB.bagChecks[k] || [];
  const i = list.indexOf(key);
  if(i>=0) list.splice(i,1); else list.push(key);
  DB.bagChecks[k] = list;
  persist();
}

/* ============================================================
   SMART LOCKER & DEPARTURE LOGIC
   ============================================================ */
function generatePackingRecommendations(studentId){
  const s = studentById(studentId);
  if(!s) return {takeHome: [], leaveInLocker: [], reminders: [], totalWeight: 0};

  const tomorrowDay = DAYMAP[new Date(tomorrowISO()+'T00:00:00').getDay()];
  const tt = (DB.timetable[s.class] && DB.timetable[s.class][tomorrowDay]) || [];
  const ttSubjects = tt.map(p=>p.subject).filter(Boolean);
  
  // Homework due tomorrow
  const hw = DB.homework.filter(h=>h.class===s.class && h.due===tomorrowISO());
  const hwSubjects = hw.map(h=>h.subject);
  
  // Exams within next 2 days
  const exams = DB.exams.filter(e=>e.class===s.class && e.date>=todayISO() && e.date<=offDate(2));
  const examSubjects = exams.map(e=>e.subject);
  
  // Projects due within next 3 days
  const projects = DB.projects.filter(p=>p.class===s.class && p.dueDate>=todayISO() && p.dueDate<=offDate(3));
  const projectSubjects = projects.map(p=>p.subject);

  // Combine all required subjects
  const requiredSubjects = new Set([...ttSubjects, ...hwSubjects, ...examSubjects, ...projectSubjects]);

  const lockerItems = DB.locker.filter(l=>l.studentId===studentId);
  
  const takeHome = [];
  const leaveInLocker = [];
  let totalWeight = 0;

  lockerItems.forEach(item=>{
    const isRequired = requiredSubjects.has(item.subject) || item.status === 'Taken Home';
    if(isRequired){
      takeHome.push({...item, reason: 'Required for classes/homework tomorrow'});
      if(item.weight) totalWeight += Number(item.weight);
    } else {
      leaveInLocker.push({...item, reason: 'Not needed tomorrow'});
    }
  });

  // Generate Reminders
  const reminders = [];
  hw.forEach(h=>reminders.push(`Complete ${h.subject} homework: ${h.title}`));
  exams.forEach(e=>reminders.push(`Study for ${e.subject} exam on ${fmtShort(e.date)}`));
  projects.forEach(p=>reminders.push(`Bring materials for ${p.subject} project (Due: ${fmtShort(p.dueDate)})`));
  
  if(ttSubjects.length) {
    reminders.push(`Tomorrow's classes: ${[...new Set(ttSubjects)].join(', ')}`);
  }

  return {takeHome, leaveInLocker, reminders, totalWeight};
}

function getDepartureInstructions(cls){
  // Used for TV Display. Aggregate by subject.
  const tomorrowDay = DAYMAP[new Date(tomorrowISO()+'T00:00:00').getDay()];
  const tt = (DB.timetable[cls] && DB.timetable[cls][tomorrowDay]) || [];
  const ttSubjects = [...new Set(tt.map(p=>p.subject).filter(Boolean))];
  
  const hw = DB.homework.filter(h=>h.class===cls && h.due===tomorrowISO());
  const hwSubjects = [...new Set(hw.map(h=>h.subject))];
  
  const exams = DB.exams.filter(e=>e.class===cls && e.date>=todayISO() && e.date<=offDate(2));
  const examSubjects = [...new Set(exams.map(e=>e.subject))];

  const projects = DB.projects.filter(p=>p.class===cls && p.dueDate>=todayISO() && p.dueDate<=offDate(3));

  const projectSubjects = [...new Set(projects.map(p=>p.subject))];
  const takeHome = [...new Set([...ttSubjects, ...hwSubjects, ...examSubjects, ...projectSubjects])];
  
  const allSubjects = SUBJECTS; // Assuming locker has all standard subjects
  const leaveInLocker = allSubjects.filter(s => !takeHome.includes(s));

  const reminders = [];
  hw.forEach(h=>reminders.push(`${h.subject}: ${h.title}`));
  exams.forEach(e=>reminders.push(`${e.subject} Exam on ${fmtShort(e.date)}`));
  projects.forEach(p=>reminders.push(`${p.subject} Project due ${fmtShort(p.dueDate)}: ${p.description}`));

  // Check for custom override
  const override = DB.departureSettings.overrides && DB.departureSettings.overrides[cls];
  if(override) {
    return {
      takeHome: override.takeHome.split('\n').filter(Boolean),
      leaveInLocker: override.leaveInLocker.split('\n').filter(Boolean),
      reminders: override.reminders.split('\n').filter(Boolean)
    };
  }

  return { takeHome, leaveInLocker, reminders };
}

  } catch (e) {
    console.error("Topbar Render Error:", e);
  }
}

function goTo(portal, view){
  if(portal && portal !== state.portal){
    state.portal = portal;
    state.userId = firstUserId(portal);
    state.childId = null;
  }
  state.view = view || 'dashboard';
  state.query = '';
  saveSession();
  render();
  $('#main').scrollTop = 0;
  $('#sidebar').classList.remove('open');
  $('#backdrop').classList.remove('show');
}

function pageHead(title, sub, actions){
  return '<div class="page-hd"><div><h1>'+esc(title)+'</h1>'+
    (sub?'<p>'+esc(sub)+'</p>':'')+'</div><div class="page-actions">'+(actions||'')+'</div></div>';
}
function card(title, body, extra){
  return '<section class="card">'+
    (title?'<div class="card-hd"><h3>'+esc(title)+'</h3>'+(extra||'')+'</div>':'')+
    '<div class="card-bd">'+body+'</div></section>';
}
function statCard(iconName, tint, value, label){
  return '<div class="card"><div class="stat">'+
    '<div class="stat-ic '+tint+'">'+icon(iconName)+'</div>'+
    '<div><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div></div></div>';
}
function emptyState(msg){
  return '<div class="empty">'+icon('search')+'<p>'+esc(msg)+'</p></div>';
}
function barChart(data){
  const max = Math.max(1, Math.max.apply(null, data.map(d=>d.v)));
  let h = '<div class="chart">';
  data.forEach(d=>{
    const px = Math.round((d.v/max)*110);
    h += '<div class="chart-col"><div class="chart-bar" style="height:'+Math.max(4,px)+'px">'+
      '<span>'+d.v+'</span></div><div class="chart-lbl">'+esc(d.l)+'</div></div>';
  });
  return h+'</div>';
}
function ring(pct){
  return '<div class="ring" style="--p:'+pct+'"><span>'+pct+'%</span></div>';
}
function statusBadge(status){
  if(status==='present') return '<span class="badge ok">Present</span>';
  if(status==='late')    return '<span class="badge warn">Late</span>';
  if(status==='absent')  return '<span class="badge bad">Absent</span>';
  return '<span class="badge">—</span>';
}
function grade(p){
  if(p>=90) return '<span class="badge ok">A+</span>';
  if(p>=80) return '<span class="badge ok">A</span>';
  if(p>=70) return '<span class="badge info">B</span>';
  if(p>=60) return '<span class="badge warn">C</span>';
  if(p>=50) return '<span class="badge warn">D</span>';
  return '<span class="badge bad">E</span>';
}

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
function closeModal(){ $('#modalRoot').innerHTML = ''; }

function openForm(opts){
  const fields = opts.fields || [];
  const values = opts.values || {};
  const body = fields.map(function(f){
    const raw = values[f.name] != null ? values[f.name] : (f.default != null ? f.default : '');
    if(f.type === 'select'){
      return '<label class="field"><span>'+esc(f.label)+'</span><select name="'+f.name+'" class="select">'+
        f.options.map(function(o){
          const ov = (o.value != null ? o.value : o);
          const ol = (o.label != null ? o.label : o);
          return '<option value="'+esc(ov)+'"'+(String(ov)===String(raw)?' selected':'')+'>'+esc(ol)+'</option>';
        }).join('')+'</select></label>';
    }
    if(f.type === 'multiselect'){
      const arr = Array.isArray(raw) ? raw : [];
      return '<label class="field"><span>'+esc(f.label)+'</span><select name="'+f.name+'" class="select" multiple size="6">'+
        (f.options.length ? f.options.map(function(o){
          const ov = (o.value != null ? o.value : o);
          const ol = (o.label != null ? o.label : o);
          return '<option value="'+esc(ov)+'"'+(arr.indexOf(ov)>=0?' selected':'')+'>'+esc(ol)+'</option>';
        }).join('') : '<option disabled>Nothing available yet</option>')+
        '</select></label>';
    }
    if(f.type === 'textarea'){
      return '<label class="field"><span>'+esc(f.label)+'</span><textarea name="'+f.name+'" class="input" rows="3">'+esc(raw)+'</textarea></label>';
    }
    if(f.type === 'file'){
      return '<label class="field"><span>'+esc(f.label)+'</span><input type="file" name="'+f.name+'" class="input" accept=".pdf,.doc,.docx,.jpg,.png,.txt"></label>';
    }
    return '<label class="field"><span>'+esc(f.label)+'</span><input name="'+f.name+'" type="'+(f.type||'text')+
      '" class="input" value="'+esc(raw)+'"'+(f.required?' required':'')+'></label>';
  }).join('');

  $('#modalRoot').innerHTML =
    '<div class="modal-back" data-act="modal-close">'+
      '<div class="modal">'+
        '<div class="modal-hd"><h3>'+esc(opts.title)+'</h3>'+
          '<button class="btn btn-sm" data-act="modal-close">'+icon('x')+'</button></div>'+
        '<form id="modalForm" class="modal-bd">'+body+
          '<div class="modal-ft"><button type="button" class="btn" data-act="modal-close">Cancel</button>'+
          '<button type="submit" class="btn btn-primary">'+esc(opts.submitLabel||'Save')+'</button></div>'+
        '</form>'+
      '</div>'+
    '</div>';

  $('#modalForm').addEventListener('submit', async function(ev){
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {};
    fields.forEach(function(f){
      if(f.type === 'multiselect'){ data[f.name] = fd.getAll(f.name).map(String); return; }
      if(f.type === 'file'){
        const file = fd.get(f.name);
        data[f.name] = (file && file.size > 0) ? file : null;
        return;
      }
      const rawv = fd.get(f.name);
      data[f.name] = f.type==='number' ? Number(rawv) : String(rawv==null?'':rawv);
    });
    closeModal();
    await opts.onSave(data);
  });
}

function vStudentPlanner(){
  const s = currentUser();
  if(!s) return emptyState('No student profile.');
  const pending = pendingHomework(s.id).sort((a,b)=>a.due.localeCompare(b.due));
  const exams = DB.exams.filter(e=>e.class===s.class && e.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date));

  const plan = [];
  pending.slice(0,5).forEach((h,i)=>{
    plan.push({when: offDate(i%3), title:'Homework: '+h.title, subject:h.subject, tag:'Homework', urgent: daysUntil(h.due)<=1});
  });
  exams.slice(0,4).forEach((e,i)=>{
    plan.push({when: offDate(i+1), title:'Revise '+e.subject+' for '+e.name, subject:e.subject, tag:'Revision', urgent: daysUntil(e.date)<=3});
  });
  plan.sort((a,b)=>a.when.localeCompare(b.when));

  let body = '';
  if(!plan.length) body = emptyState('Nothing to plan yet — homework and exams will appear here.');
  else {
    body = '<div class="list">';
    plan.forEach(p=>{
      body += '<div class="list-item"><div class="avatar">'+esc(p.subject[0])+'</div>'+
        '<div class="grow"><b>'+esc(p.title)+'</b><span>'+fmtDate(p.when)+' · '+esc(p.subject)+'</span></div>'+
        '<span class="badge '+(p.urgent?'bad':'info')+'">'+esc(p.tag)+'</span></div>';

    card('Suggested plan', body);
}

/* ---- AI send handler ---- */
async function handleAiSend(mode, prefillMsg){
  const msgEl = $('#aiUserMsg');
  const msg   = prefillMsg || (msgEl ? msgEl.value.trim() : '');
  if(!msg){ toast('Type a message first','err'); return; }

  const subjectEl = $('#aiSubjectInp');
  if(subjectEl) state.aiSubject = subjectEl.value.trim();

  const container = $('#aiMessages');
  if(container && !prefillMsg){
    container.insertAdjacentHTML('beforeend', aiMsgBubble('user', msg));
    container.scrollTop = container.scrollHeight;
  }
  if(msgEl && !prefillMsg) msgEl.value = '';

  const statusEl = $('#aiTypingStatus');
  const sendBtn  = $('#aiSendBtn');
  if(statusEl) statusEl.style.display = '';
  if(sendBtn)  sendBtn.disabled = true;

  try {
    if(!_sbConfigured || !SB) throw new Error('Supabase not configured. Add your project URL and anon key to window.BAGBUDDY_CONFIG.');
    const reply = await callAiEdgeFunction(mode, msg, { subject: state.aiSubject });
    if(container){
      container.insertAdjacentHTML('beforeend', aiMsgBubble('assistant', reply));
      container.scrollTop = container.scrollHeight;
    }
  } catch(err){
    const isOffline = !navigator.onLine;
    const errMsg = isOffline
      ? 'You are offline. Check your connection and try again.'
      : (err.message || 'Something went wrong. Please try again.');
    if(container){
      container.insertAdjacentHTML('beforeend',
        '<div class="ai-msg assistant" style="border-color:var(--danger);color:var(--danger)">'+
        '\u26a0 '+esc(errMsg)+
        ' <button class="btn btn-sm btn-danger" style="margin-top:6px" data-act="ai-retry" data-mode="'+mode+'" data-msg="'+esc(msg)+'">Retry</button></div>'
      );
      container.scrollTop = container.scrollHeight;
    }
  } finally {
    if(statusEl) statusEl.style.display = 'none';
    if(sendBtn)  sendBtn.disabled = false;
  }
}

      statCard('wallet','tint-danger', '₹'+feesPending.toLocaleString(),'Fees pending')+

function studentForm(student){
  if(!DB.classes.length){
    toast('Create a class first in Classes & Assignments','err');
    return;
  }
  const parentOptions = [{value:'', label:'— none —'}].concat(DB.parents.map(p=>({value:p.id, label:p.name})));
  const classOptions = DB.classes.slice();
  if(student && student.class && classOptions.indexOf(student.class) < 0){
    classOptions.push(student.class);
  }
  openForm({
    title: student ? 'Edit student' : 'Add student',
    values: student || {class: DB.classes[0], roll:1, guardianId:''},
    fields:[
      {name:'name', label:'Full name', required:true},
      {name:'class', label:'Class', type:'select', options: classOptions},
      {name:'roll', label:'Roll number', type:'number'},
      {name:'email', label:'Email'},
      {name:'guardianId', label:'Guardian', type:'select', options: parentOptions}
    ],
    onSave:function(d){
      if(student){
        student.name = d.name; student.class = d.class;
        student.roll = Number(d.roll)||1; student.email = d.email;
        linkGuardian(student.id, d.guardianId || null);
      } else {
        const s = {id:uid('s'), name:d.name, class:d.class, roll:Number(d.roll)||1, email:d.email, guardianId:null};
        DB.students.push(s);
        if(d.guardianId) linkGuardian(s.id, d.guardianId);
      }
      persist(); render(); toast(student?'Student updated':'Student added','ok');
    }
  });
}

function parentForm(parent){

      {name:'phone', label:'Phone'},

    onSave:function(d){

  });

async function refreshResources(){
  const el = $('#resList');
  if(!el) return;
  try{
    const files = await FileStore.all();
    if(!files.length){
      el.innerHTML = '<p class="muted small">No files uploaded yet. Uploaded resources live in IndexedDB and survive refresh.</p>';
      return;
    }
    el.innerHTML = files.map(f=>
      '<div class="file-row"><div class="avatar">'+esc(initials(f.name))+'</div>'+
      '<div style="flex:1;min-width:0"><b class="small">'+esc(f.name)+'</b><br>'+
      '<span class="small muted">'+Math.round((f.size||0)/1024)+' KB · '+fmtDate((f.added||'').slice(0,10))+'</span></div>'+
      '<button class="btn btn-sm" data-act="res-download" data-id="'+f.id+'">'+icon('download')+'</button>'+
      '<button class="btn btn-sm btn-danger" data-act="res-delete" data-id="'+f.id+'">'+icon('trash')+'</button></div>').join('');
  }catch(e){
    el.innerHTML = '<p class="muted small">IndexedDB is not available in this browser context. '+
      'The rest of the app continues to work with localStorage.</p>';
  }
}

function launchTVMode(){
  state.tvMode = true;
  state.tvIndex = 0;
  $('#appShell').style.display = 'none';
  $('#tvContainer').style.display = 'flex';
  
  renderTVDisplay();
  
  const interval = (DB.departureSettings.rotationInterval || 15) * 1000;
  state.tvTimer = setInterval(()=>{
    state.tvIndex++;
    renderTVDisplay();
  }, interval);
}

function stopTVMode(){
  state.tvMode = false;
  clearInterval(state.tvTimer);
  $('#tvContainer').style.display = 'none';
  $('#appShell').style.display = 'flex';
  render();
}

function vSearch(){
  const q = (state.query||'').trim();
  if(!q) return pageHead('Search','Find students, teachers, homework, books, notices and events') +
    card(null, emptyState('Type a query in the search box above.'));

  const res = globalSearch(q);
  let body;
  if(!res.length){
    body = emptyState('No results for "'+q+'"');
  } else {
    body = '<div class="list">'+res.map(r=>
      '<div class="list-item"><div class="avatar">'+esc(initials(r.label))+'</div>'+
      '<div class="grow"><b>'+esc(r.label)+'</b><span>'+esc(r.type)+'</span></div>'+
      (r.view ? '<button class="btn btn-sm" data-act="nav" data-view="'+r.view+'">Open</button>' : '')+
      '</div>').join('')+'</div>';
  }
  return pageHead('Search results for "'+q+'"', res.length+' matches found') + card(null, body);
}

function globalSearch(q){
  const lq = q.toLowerCase();
  const out = [];
  DB.students.forEach(s=>{
    if((s.name+' '+s.class).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Student · Class '+s.class, label:s.name, view:'dashboard'});
  });
  DB.teachers.forEach(t=>{
    if((t.name+' '+t.subject).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Teacher · '+t.subject, label:t.name, view:'dashboard'});
  });
  DB.parents.forEach(p=>{
    if(p.name.toLowerCase().indexOf(lq)>=0)
      out.push({type:'Parent', label:p.name, view:'dashboard'});
  });
  DB.homework.forEach(h=>{
    if((h.title+' '+h.subject+' '+h.class).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Homework · Class '+h.class+' · Due '+fmtDate(h.due), label:h.title, view:'homework'});
  });
  DB.projects.forEach(p=>{
    if((p.name+' '+p.subject+' '+p.class).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Project · Class '+p.class+' · Due '+fmtDate(p.dueDate), label:p.name, view:'projects'});
  });
  DB.locker.forEach(l=>{
    if((l.name+' '+l.subject).toLowerCase().indexOf(lq)>=0) {
      const s = studentById(l.studentId);
      out.push({type:'Locker Item · '+(s?s.name:''), label:l.name, view:'locker'});
    }
  });
  DB.notes.forEach(n=>{
    if((n.title+' '+n.subject+' '+n.class).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Note · Class '+n.class+' · '+n.subject, label:n.title, view:'notes'});
  });
  DB.library.forEach(b=>{
    if((b.title+' '+b.author).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Library · '+b.subject, label:b.title+' — '+b.author, view:'library'});
  });
  DB.notices.forEach(n=>{
    if((n.title+' '+n.body).toLowerCase().indexOf(lq)>=0)
      out.push({type:'Notice · '+fmtDate(n.date), label:n.title, view:'notices'});
  });
  return out.slice(0,40);
}

function renderNotifPanel(){
  const list = (DB.notifications || []).slice().sort((a,b)=>b.date.localeCompare(a.date));
  let html = '<div class="np-hd"><b>Notifications</b>'+
    '<button class="btn btn-sm btn-ghost" data-act="notif-read-all">Mark all read</button></div>';
  html += '<div class="np-list">';
  if(!list.length) html += '<div class="np-item"><span class="small muted">No notifications yet.</span></div>';
  list.forEach(n=>{
    html += '<div class="np-item '+(n.read?'':'unread')+'">'+
      '<span class="np-dot" style="'+(n.read?'background:transparent':'')+'"></span>'+
      '<div style="flex:1"><b>'+esc(n.title)+'</b><span>'+esc(n.body)+'</span><br>'+
      '<span class="small muted">'+fmtDate(n.date)+'</span></div></div>';
  });
  html += '</div>';
  $('#notifPanel').innerHTML = html;
}

function updateOnlineStatus(){
  const offline = !navigator.onLine;
  let bar = $('#offlineBar');
  if(offline && !bar){
    bar = document.createElement('div');
    bar.id = 'offlineBar';
    bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--warn);color:#111;'+
      'font-size:12px;font-weight:700;text-align:center;padding:6px;z-index:400';
    bar.textContent = 'Offline — BagBuddy keeps working. All data is stored on this device.';
    document.body.appendChild(bar);
  } else if(!offline && bar){
    bar.remove();
  }
}

function render(){
  try {
    if(state.tvMode) return;

    /* Guard: appShell must exist */
    var appShellEl = document.getElementById('appShell');
    if(!appShellEl) return;

    if(state.signedOut){
      /* Write signin page directly into appShell — no #main needed */
      appShellEl.innerHTML = '<div id="main" class="main">'+signedOutView()+'</div>';
      appShellEl.className = 'app signed-out-mode';
      return;
    }
    appShellEl.className = 'app';

    /* Ensure app shell structure exists */
    if(!document.getElementById('main')){
      appShellEl.innerHTML =
        '<div id="sidebar" class="sidebar"></div>'+
        '<div class="main-wrap"><header id="topbar" class="topbar"></header>'+
        '<main id="main" class="main"></main></div>';
    }

    document.documentElement.setAttribute('data-theme', state.theme);
    renderTopbar();

    /* first-run: show onboarding instead of any portal */
    if(totalUsers() === 0){
      $('#sidebar').innerHTML =
        '<div class="nav-label">Getting started</div>'+
        '<div class="card-bd"><p class="small muted">Create the first admin/principal account to unlock the portals. '+
        'No data is preloaded — everything you see will be created by you.</p></div>';
      $('#main').innerHTML = setupScreenHTML();
      $('#main').scrollTop = 0;
      return;
    }

    renderSidebar();

    const key = state.portal + '.' + state.view;
    let fn = VIEWS[key];
    if(state.view === 'search') fn = vSearch;
    if(!fn) fn = VIEWS[state.portal + '.dashboard'] || function(){ return emptyState('Module not found.'); };

    const scroll = $('#main').scrollTop;
    $('#main').innerHTML = fn();
    $('#main').scrollTop = scroll;

    if(state.portal === 'admin' && state.view === 'resources') refreshResources();
  } catch (err) {
    console.error("Render Error:", err);
    $('#main').innerHTML = '<div class="empty" style="color:var(--danger)"><p><b>Application Error</b></p><p>' + esc(err.message) + '</p></div>';
  }
}

/* ---- setup form ---- */
document.addEventListener('submit', function(e){
  /* ---- Forgot password form ---- */
  if(e.target.id === 'forgotForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = String(fd.get('email')||'').trim();
    if(!email){ toast('Enter your email','err'); return; }
    const msgEl = $('#forgotMsg');
    const btn   = e.target.querySelector('button[type="submit"]');
    if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    sbResetPassword(email).then(function(){
      if(msgEl){ msgEl.textContent='✓ Reset link sent! Check your email.'; msgEl.style.color='var(--success)'; msgEl.style.display=''; }
    }).catch(function(err){
      if(msgEl){ msgEl.textContent=err.message||'Could not send reset link.'; msgEl.style.color='var(--danger)'; msgEl.style.display=''; }
    }).finally(function(){
      if(btn){ btn.disabled=false; btn.textContent='Send reset link'; }
    });
    return;
  }
  if(e.target.id === 'classFeesForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    DB.classes.forEach(c=>{
      const amount = Number(fd.get('fee_'+c));
      const term = String(fd.get('term_'+c)||'Annual Fee').trim() || 'Annual Fee';
      if(amount > 0) DB.classFees[c] = {amount,term}; else delete DB.classFees[c];
    });
    persist(); render(); toast('Class fees saved','ok'); return;
  }
  if(e.target.id === 'signUpForm'){
    e.preventDefault();
    const fd       = new FormData(e.target);
    const school   = String(fd.get('school')||'').trim();
    const name     = String(fd.get('name')||'').trim();
    const phone    = String(fd.get('phone')||'').trim();
    const email    = String(fd.get('email')||'').trim();
    const password = String(fd.get('password')||'');
    const password2= String(fd.get('password2')||'');

    if(_sbConfigured){
      /* ── Validation ── */
      const errEl = $('#signUpError');
      function showErr(msg){ if(errEl){ errEl.textContent=msg; errEl.style.display=''; } }

      if(!school)              return showErr('Please enter your school name.');
      if(!name)                return showErr('Please enter your full name.');
      if(!email)               return showErr('Please enter your email address.');
      if(password.length < 8)  return showErr('Password must be at least 8 characters.');
      if(password !== password2) return showErr('Passwords do not match.');
      if(errEl) errEl.style.display = 'none';

      const btn = $('#signUpBtn');
      if(btn){ btn.disabled=true; btn.textContent='Creating your school…'; }

      /* ── Step 1: Create auth user ── */
      sbSignUp(email, password, {}).then(async function(data){
        if(!data.session){
          /* Email confirmation required — tell them to check email */
          const step1 = $('#signUpStep1');
          const step2 = $('#signUpStep2');
          const msg   = $('#signUpWelcomeMsg');
          const sub   = $('#signUpWelcomeSub');
          if(step1) step1.style.display = 'none';
          if(step2) step2.style.display = '';
          if(msg)   msg.textContent = 'Check your email!';
          if(sub)   sub.textContent = 'We sent a confirmation link to '+email+'. Click it then come back and sign in.';
          const spin = step2 && step2.querySelector('.spin');
          if(spin) spin.style.display = 'none';
          return;
        }

        /* ── Step 2: Hit register-school Edge Function ── */
        try {
          const result = await sbRegisterSchool(name, school, phone);

          /* ── Step 3: Refresh session to get new role in JWT ── */
          await SB.auth.refreshSession();
          await sbRefreshUser();

          /* Show success screen briefly then enter app */
          const step1 = $('#signUpStep1');
          const step2 = $('#signUpStep2');
          const msg   = $('#signUpWelcomeMsg');
          const sub   = $('#signUpWelcomeSub');
          if(step1) step1.style.display = 'none';
          if(step2) step2.style.display = '';
          if(msg)   msg.textContent = 'Welcome, '+name+'!';
          if(sub)   sub.textContent = school+' is now live on BagBuddy. Setting up your dashboard…';

          setTimeout(function(){
            state.signedOut = false;
            state.authMode  = 'signin';
            state.view      = 'dashboard';
            if(_sbProfile) state.portal = roleToPortal(_sbProfile.role);
            else state.portal = 'principal';
            render();
            toast('🎉 Welcome to BagBuddy, '+name+'!', 'ok');
          }, 2000);

        } catch(regErr){
          /* Registration edge function failed — sign out and show error */
          await sbSignOut();
          if(btn){ btn.disabled=false; btn.textContent='Create school account'; }
          showErr((regErr.message || 'Could not register school. Please try again.'));
        }

      }).catch(function(err){
        if(btn){ btn.disabled=false; btn.textContent='Create school account'; }
        showErr(err.message || 'Sign-up failed. Please try again.');
      });
      return;
    }

    /* ── Legacy localStorage signup ── */
    if(!school || !name || !email || password.length < 4){ toast('Complete all fields; password must be at least 4 characters','err'); return; }
    const principal = {id:uid('a'), name, role:'Principal', email, password};
    DB.settings.school = school;
    DB.admins.push(principal);
    if(!DB.schools.some(s=>s.name.toLowerCase()===school.toLowerCase())) DB.schools.push({id:uid('school'),name:school,status:'Enrolled',students:0,teachers:0,parents:0});
    saveDB();
    state.portal='principal'; state.userId=principal.id; state.signedOut=false; state.authMode='signin'; state.view='dashboard';
    saveSession(); render(); toast('School account created','ok');
    return;
  }
  if(e.target.id === 'signInForm'){
    e.preventDefault();
    const formData = new FormData(e.target);
    const password = String(formData.get('password')||'');

    if(_sbConfigured){
      /* ── Supabase sign-in ── */
      const email = String(formData.get('email')||'').trim();
      if(!email){ toast('Enter your email','err'); return; }
      const btn = $('#signInBtn');
      const errEl = $('#signInError');
      if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }
      if(errEl) errEl.style.display='none';
      sbSignIn(email, password).then(function(){
        state.signedOut = false; state.authMode = 'signin'; state.view = 'dashboard';
        if(_sbProfile){
          state.portal = roleToPortal(_sbProfile.role);
          state.userId = _sbProfile.id;
          if(_sbProfile.school_id) DB.settings.school = _sbProfile.meta?.school_name || DB.settings.school;
        }
        saveSession(); render(); toast('Welcome back!','ok');
      }).catch(function(err){
        if(errEl){ errEl.textContent = err.message || 'Sign-in failed. Check your email and password.'; errEl.style.display=''; }
      }).finally(function(){
        const btn2 = $('#signInBtn');
        if(btn2){ btn2.disabled=false; btn2.textContent='Sign In'; }
      });
      return;
    }

    /* ── Legacy localStorage sign-in ── */
    const username = String(formData.get('username')||'').trim().toLowerCase();
    if(!username) return;
    const account = DB.students.concat(DB.teachers,DB.parents,DB.admins,DB.workspaceAdmins).find(x=>String(x.name||'').toLowerCase()===username || String(x.email||'').toLowerCase()===username);
    const id = account ? account.id : '';
    if(!account || password !== (account.password || 'bagbuddy')){ toast('Incorrect password','err'); return; }
    let portal = 'student';
    if(DB.teachers.some(x=>x.id===id)) portal = 'teacher';
    else if(DB.parents.some(x=>x.id===id)) portal = 'parent';
    else if(DB.workspaceAdmins.some(x=>x.id===id)) portal = 'workspace';
    else if(DB.admins.some(x=>x.id===id && x.role==='Principal')) portal = 'principal';
    else if(DB.admins.some(x=>x.id===id)) portal = 'admin';
    state.portal = portal;
    state.userId = id;
    state.signedOut = false;
    state.view = 'dashboard';
    state.childId = null;
    saveSession();
    render();
    return;
  }
  if(e.target.id === 'profileForm'){
    e.preventDefault();
    const u = currentUser();
    if(!u) return;
    const fd = new FormData(e.target);
    u.name = String(fd.get('name')||'').trim() || u.name;
    u.email = String(fd.get('email')||'').trim();
    u.phone = String(fd.get('phone')||'').trim();
    const newPassword = String(fd.get('password')||'');
    if(newPassword && newPassword.length < 4){ toast('Password must be at least 4 characters','err'); return; }
    if(newPassword) u.password = newPassword;
    if(state.portal==='student' && fd.get('class')) u.class = String(fd.get('class'));
    if(state.portal==='teacher' && fd.get('subject')) u.subject = String(fd.get('subject'));
    persist(); render(); toast('Profile updated','ok');
    return;
  }
  /* aiChatForm is now handled via the click dispatcher (ai-send action) */
  if(e.target.id !== 'setupForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const school = String(fd.get('school')||'').trim() || 'My School';
  const name = String(fd.get('name')||'').trim();
  const role = String(fd.get('role')||'Admin');
  const email = String(fd.get('email')||'').trim();
  const password = String(fd.get('password')||'');
  if(!name){ toast('Please enter the admin name','err'); return; }
  if(password.length < 4){ toast('Password must be at least 4 characters','err'); return; }
  const admin = {id:uid('a'), name:name, role:role, email:email, password:password};
  DB.settings.school = school;
  if(role === 'Workspace Admin') DB.workspaceAdmins.push(admin); else DB.admins.push(admin);
  saveDB();
  state.portal = role === 'Principal' ? 'principal' : role === 'Workspace Admin' ? 'workspace' : 'admin';
  state.userId = admin.id;
  state.view = 'dashboard';
  state.childId = null;
  saveSession();
  render();
  toast('Account created — welcome!','ok');
});

document.addEventListener('click', function(e){

  if(!el) return;
  const act = el.getAttribute('data-act');

  if(act === 'show-signup'){
    e.preventDefault(); state.authMode='signup'; render(); return;
  }
  if(act === 'show-signin'){
    e.preventDefault(); state.authMode='signin'; render(); return;
  }

  if(act === 'forgot-password'){
    e.preventDefault();
    state.authMode = 'forgot';
    render();
    return;
  }

  /* ── Forgot password form submit (delegated click on submit btn) ── */
  if(act === 'do-forgot-password'){
    e.preventDefault();
    const inp = $('input[name="email"]', $('#main'));
    const email = inp ? inp.value.trim() : '';
    if(!email){ toast('Enter your email','err'); return; }
    const msgEl = $('#forgotMsg');
    const btn   = $('#forgotBtn');
    if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    sbResetPassword(email).then(function(){
      if(msgEl){ msgEl.textContent='✓ Reset link sent! Check your email.'; msgEl.style.color='var(--success)'; msgEl.style.display=''; }
    }).catch(function(err){
